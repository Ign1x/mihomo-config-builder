name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Lint
        run: GOPROXY=off GOSUMDB=off go vet -mod=vendor ./...
      - name: Test
        run: GOPROXY=off GOSUMDB=off go test -mod=vendor ./...
